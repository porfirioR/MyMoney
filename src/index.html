<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>
      My money
    </title>
    <base href="/">
    <!-- viewport-fit=cover lets Chrome on Android draw the app behind the navigation bar, so the bar shows the app background -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#82b366">
    <!-- ThemeService sets it to light or dark; the phone uses it for its own bars (like the navigation bar) -->
    <meta name="color-scheme" content="light dark">
    <!-- Applies the saved theme before the first paint, so dark mode does not flash white while Angular loads.
         Same storage key and rules as ThemeService (my-money.theme: system | light | dark) -->
    <style>
      html { background: #fafafa; }
      html.dark-theme { background: #303030; }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('my-money.theme');
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark-theme');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#5b7d47');
          }
        } catch (e) { }
      })();
    </script>
    <meta property="og:url" content="https://mymoney-993366.web.app/"/>
    <meta property="og:site_name" content="My Money"/>
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="My Money"/>
    <meta property="og:description" content="Web application for recording income and expenses."/>
    <meta property="og:image" content="https://mymoney-993366.web.app/assets/img/project-image.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap" rel="stylesheet">
    <!-- Only the icon sets in use: mat-icon (filled) and the outlined category icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">
  </head>
  <body class="content">
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
