<ul class="movement-list" *ngIf="movements.length">
  <ng-container *ngFor="let movement of movements; let i = index; trackBy: trackByMovement">
    <!-- Groups can span years: a header marks where each year starts -->
    <li class="year-header" *ngIf="i === 0 || movements[i - 1].date.getFullYear() !== movement.date.getFullYear()">
      {{movement.date.getFullYear()}}
    </li>
    <li>
      <button type="button" class="movement-row"
        [matMenuTriggerFor]="movementMenu"
        [matMenuTriggerData]="{ movement: movement }"
        [title]="'movement-options-button' | translate"
      >
        <span class="movement-icon" customColor
          [color]="movement.color"
          [backgroundColor]="movement.backgroundColor"
        >
          <i class="material-icons-outlined notranslate">{{movement.icon}}</i>
        </span>
        <span class="movement-text">
          <span class="movement-memorandum">{{movement.memorandum | translate}}</span>
          <span class="movement-date">{{movement.date | date: 'EEE dd/MM/yy': '': language}}</span>
        </span>
        <span class="movement-amount" [class.income]="!movement.isExpense">
          {{movement.isExpense ? '-' : ''}}{{movement.amount | number:'' : numberType}}
        </span>
        <mat-icon class="movement-more">more_vert</mat-icon>
      </button>
    </li>
  </ng-container>
</ul>

<mat-menu #movementMenu="matMenu" xPosition="before">
  <ng-template matMenuContent let-movement="movement">
    <button mat-menu-item (click)="editMovement(movement)" [disabled]="!movement.movement" [title]="'edit-button' | translate">
      <mat-icon>edit</mat-icon>
      <span>{{'Edit' | translate}}</span>
    </button>
    <button mat-menu-item class="menu-delete" (click)="deletedMovement(movement.id)" [title]="'related-movement-messages.title-delete-movement' | translate">
      <mat-icon>link_off</mat-icon>
      <span>{{'related-movement-messages.remove-from-group' | translate}}</span>
    </button>
  </ng-template>
</mat-menu>
