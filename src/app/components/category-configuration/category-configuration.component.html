<app-page-layout title="Category configuration">
  <mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>
  <app-skeleton *ngIf="loading" [cards]="1" [lines]="6"></app-skeleton>
  <mat-tab-group mat-stretch-tabs mat-align-tabs="center" *ngIf="!loading" [selectedIndex]="selectedIndex" (selectedTabChange)="tabChanged($event)">
    <mat-tab [label]="categoryType.income | translate">
      <main id="main-income" class="fab-space">
        <ng-container *ngFor="let item of incomeCategory">
          <app-category-row [category]="item" (updateCategoryEvent)="updateCategories($event)"></app-category-row>
        </ng-container>
      </main>
    </mat-tab>
    <mat-tab [label]="categoryType.expense | translate">
      <main id="main-expense" class="fab-space">
        <ng-container *ngFor="let item of expenseCategory">
          <app-category-row [category]="item" (updateCategoryEvent)="updateCategories($event)"></app-category-row>
        </ng-container>
      </main>
    </mat-tab>
  </mat-tab-group>
  <button mat-fab color="primary" class="btn-add" [routerLink]="['new-category', currentTap]" [disabled]="loading" [title]="'Add category' | translate">
    <mat-icon>add</mat-icon>
  </button>
</app-page-layout>
