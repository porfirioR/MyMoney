<h1 matDialogTitle translate>Upload Movement</h1>
<mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>
<mat-dialog-content>
  {{'import-movement-messages.to-save' | translate: { count: data.length } }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button [mat-dialog-close]="false" color="primary" cdkFocusInitial [disabled]="loading" [title]="'cancel-button' | translate">
    {{'Cancel' | translate}}
  </button>
  <button mat-flat-button (click)="upload()" color="primary" [disabled]="loading" [title]="'upload-button' | translate">
    {{'Upload' | translate}}
  </button>
</mat-dialog-actions>
