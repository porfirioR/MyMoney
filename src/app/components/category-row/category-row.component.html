<article class="row-category" [class.inactive]="!category.active">
  <button mat-icon-button
    [title]="(category.active ? 'hide-category-button' : 'show-category-button') | translate"
    [disabled]="saving"
    (click)="toggleActive()"
  >
    <mat-icon [ngClass]="{ 'icon-color-green': !category.active }">
      {{ category.active ? 'visibility' : 'visibility_off' }}
    </mat-icon>
  </button>
  <span class="order-number">{{hasOrder ? category.order : ''}}</span>
  <button mat-mini-fab customColor
    [color]="category.color"
    [backgroundColor]="category.backgroundColor"
    [title]="'icon-category-button' | translate"
  >
    <i class="material-icons-outlined notranslate">{{category.icon}}</i>
  </button>
  <span class="category-name">
    {{category.name | translate}}
    <span class="mine-chip" *ngIf="isOwnCategory">{{ 'Mine' | translate }}</span>
  </span>
  <button mat-icon-button [routerLink]="['edit-category', category.id]" [title]="'edit-category-button' | translate">
    <mat-icon>edit</mat-icon>
  </button>
</article>
<mat-divider></mat-divider>
