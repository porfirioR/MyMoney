# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate environment.prod.ts from secrets
        run: |
          cat > src/environments/environment.prod.ts << EOF
          export const environment = {
            production: true,
            firebase: {
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}',
              databaseURL: '${{ secrets.FIREBASE_DATABASE_URL }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              locationId: '',
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              measurementId: '${{ secrets.FIREBASE_MEASUREMENT_ID }}',
            },
            header: 'Date(dd/MM/yyyy),Expense/Income,Category,Memorandum,Amount',
            title: 'My Money'
          };
          EOF
      - run: npm ci --legacy-peer-deps && npm run prod
      - name: Deploy preview channel via CLI
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYMONEY_993366 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          CHANNEL_ID="pr${{ github.event.pull_request.number }}"
          npx firebase-tools@15.24.0 hosting:channel:create "$CHANNEL_ID" --project mymoney-993366 --non-interactive || true
          npx firebase-tools@15.24.0 hosting:channel:deploy "$CHANNEL_ID" \
            --expires 7d --project mymoney-993366 --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
